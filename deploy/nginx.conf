# 和久博客 · Nginx 反向代理示例
#
# 用法：
#   1. 把本文件放到 /etc/nginx/sites-available/hl-blog
#   2. 软链到 sites-enabled，并替换 your-domain.com 与证书路径
#   3. certbot --nginx -d your-domain.com  自动申请证书后会改写本文件
#
# 说明：安全性由应用自己负责（CSP、HSTS、Cookie 属性），
# 这里只负责 TLS 终结、转发与静态资源缓存。

upstream hl_blog_app {
    server 127.0.0.1:8787;
    keepalive 32;
}

# HTTP 一律跳转 HTTPS（Let's Encrypt 验证路径除外）
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;

    # ── 证书 ──
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 上传体积：要 ≥ 应用里的 UPLOAD_MAX_BYTES ──
    client_max_body_size 8m;

    # ── 安全响应头（应用也会发，这里补一层兜底）──
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── 压缩 ──
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 构建产物带内容哈希，可以长期缓存
    location /assets/ {
        proxy_pass http://hl_blog_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 上传的图片/音视频
    location /uploads/ {
        proxy_pass http://hl_blog_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 接口：不缓存，转发真实 IP 给应用的限流逻辑
    location /api/ {
        proxy_pass http://hl_blog_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # 其余全部交给应用（含 SPA 路由回退）
    location / {
        proxy_pass http://hl_blog_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
